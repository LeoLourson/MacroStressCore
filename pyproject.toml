[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "macrostress-core"
version = "0.2.0"
description = "MacroStress-Agent: event text -> transmission graph -> Track A v3.2 stress test -> approved report"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.4",
  "scipy==1.17.1",
  "pydantic==2.12.5",
  "langgraph==1.0.10",
  "langgraph-checkpoint-postgres==3.0.4",
  "langgraph-checkpoint-sqlite==3.0.3",
  "psycopg[binary,pool]==3.3.3",
  "sqlalchemy==2.0.53",
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "fastmcp==2.14.7",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "graphifyy==0.9.67",
    "import-linter==2.15",
    "pytest==8.4.2",
    "ruff==0.12.12",
]

[project.optional-dependencies]
# PDF events: parsed at upload, before a run starts.
docling = ["docling==2.127.0"]

[project.scripts]
msa-api = "msa.api.__main__:main"
msa-plugin = "msa.cli.plugin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msa"]
# A plugin's tests live in its folder (src/msa/plugins/<id>/tests) and stay out of the wheel.
exclude = ["src/msa/plugins/*/tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/msa/plugins"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The boundary between the core and the plugins (docs/plugins.md, "Границы и совместная
# работа"). The core is everything under msa outside msa.plugins; a plugin is one package
# msa.plugins.<id>. Wildcards keep a new plugin out of this file. A plugin's own tests
# (msa.plugins.<id>.tests) drive the platform as a harness and may import the core.
[tool.importlinter]
root_package = "msa"

[[tool.importlinter.contracts]]
name = "The core does not import plugins"
type = "forbidden"
source_modules = ["msa.*"]
forbidden_modules = ["msa.plugins"]

[[tool.importlinter.contracts]]
name = "Plugins import only msa.plugin_sdk, msa.contracts and their own package"
type = "forbidden"
source_modules = ["msa.plugins.*"]
forbidden_modules = ["msa.*"]
allow_indirect_imports = true
ignore_imports = [
  "msa.plugins.** -> msa.plugin_sdk",
  "msa.plugins.** -> msa.plugin_sdk.**",
  "msa.plugins.** -> msa.contracts",
  "msa.plugins.** -> msa.contracts.**",
  "msa.plugins.*.tests.** -> msa.**",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Plugins are independent of each other, except for the base plugin market"
type = "independence"
modules = ["msa.plugins.*"]
ignore_imports = [
  "msa.plugins.** -> msa.plugins.market",
  "msa.plugins.** -> msa.plugins.market.**",
]
unmatched_ignore_imports_alerting = "none"
